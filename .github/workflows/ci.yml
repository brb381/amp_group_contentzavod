name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen backend test image
        run: docker compose --env-file .env.ci.example --profile test build test
      - name: Run backend unit tests
        run: >-
          docker compose --env-file .env.ci.example --profile test run --rm --no-deps test
          python -m pytest -q
          --ignore=tests/test_account_retention_postgresql.py
          --ignore=tests/test_database_runtime_roles.py
          --ignore=tests/test_export_storage_s3.py
          --ignore=tests/test_exports_postgresql.py
          --ignore=tests/test_payout_retention_postgresql.py
          --ignore=tests/test_payouts_postgresql.py

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL and S3 integration tests
        run: >-
          docker compose --env-file .env.ci.example
          -f docker-compose.yml -f docker-compose.ci.yml
          --profile test run --rm --build test
          python -m pytest -q
          tests/test_account_retention_postgresql.py
          tests/test_database_runtime_roles.py
          tests/test_export_storage_s3.py
          tests/test_exports_postgresql.py
          tests/test_payout_retention_postgresql.py
          tests/test_payouts_postgresql.py
      - name: Stop integration services
        if: always()
        run: >-
          docker compose --env-file .env.ci.example
          -f docker-compose.yml -f docker-compose.ci.yml
          --profile test down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged production Compose
        run: >-
          docker compose --env-file .env.ci.example
          -f docker-compose.yml -f docker-compose.production.yml config --quiet
