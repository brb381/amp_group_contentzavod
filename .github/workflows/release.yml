name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: names
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.repository }}/backend:sha-${{ github.sha }}

      - name: Build and publish web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repository }}/web:${{ github.ref_name }}
            ghcr.io/${{ steps.names.outputs.repository }}/web:sha-${{ github.sha }}

      - name: Create immutable release manifest
        shell: bash
        run: |
          {
            echo "BACKEND_IMAGE=ghcr.io/${{ steps.names.outputs.repository }}/backend@${{ steps.backend.outputs.digest }}"
            echo "WEB_IMAGE=ghcr.io/${{ steps.names.outputs.repository }}/web@${{ steps.web.outputs.digest }}"
            echo "RELEASE_GIT_SHA=${{ github.sha }}"
            echo "RELEASE_TAG=${{ github.ref_name }}"
          } > release.env

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release.env
          if-no-files-found: error
          retention-days: 90
