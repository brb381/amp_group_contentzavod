services:
  minio:
    ports: !reset []

  test:
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_API_DATABASE_URL: postgresql+psycopg://amp_api:${DB_API_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_SCHEDULER_DATABASE_URL: postgresql+psycopg://amp_scheduler:${DB_SCHEDULER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_EXPORT_DATABASE_URL: postgresql+psycopg://amp_export_worker:${DB_EXPORT_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_S3_ENDPOINT_URL: http://minio:9000
      TEST_S3_PUBLIC_ENDPOINT_URL: http://minio:9000
      TEST_S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY}
      TEST_S3_API_SECRET_KEY: ${S3_API_SECRET_KEY}
      TEST_S3_WORKER_ACCESS_KEY: ${S3_WORKER_ACCESS_KEY}
      TEST_S3_WORKER_SECRET_KEY: ${S3_WORKER_SECRET_KEY}
      TEST_S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY}
      TEST_S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY}
      TEST_S3_RESTORE_ACCESS_KEY: ${S3_RESTORE_ACCESS_KEY}
      TEST_S3_RESTORE_SECRET_KEY: ${S3_RESTORE_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
