[project]
name = "amp-content-factory-api"
version = "0.1.0"
description = "API for AMP Content Factory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.138,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1,<4",
  "boto3>=1.42,<2",
  "celery[redis]>=5.5,<6",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
