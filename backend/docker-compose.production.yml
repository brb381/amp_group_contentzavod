services:
  api:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"

  minio:
    ports: !reset []

  mailpit:
    profiles: ["development"]

  email-worker:
    environment:
      ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  monitor:
    environment:
      ENVIRONMENT: production
      SMTP_HOST: ${MONITOR_SMTP_HOST:?MONITOR_SMTP_HOST is required}
      SMTP_PORT: ${MONITOR_SMTP_PORT:?MONITOR_SMTP_PORT is required}
      SMTP_USE_TLS: ${MONITOR_SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${MONITOR_SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${MONITOR_SMTP_FROM_EMAIL:?MONITOR_SMTP_FROM_EMAIL is required}
      SMTP_USERNAME: ${MONITOR_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${MONITOR_SMTP_PASSWORD:-}
